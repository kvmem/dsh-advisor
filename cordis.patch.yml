- insert:
    - id: advisor
      name: dsh-tool-advisor
      config:
        provider: !!js process.env.DSH_ADVISOR_PROVIDER ?? ''
        model: !!js process.env.DSH_ADVISOR_MODEL ?? ''
        maxInputBytes: 32768
        maxOutputTokens: 0
        maxOutputBytes: 0
        maxCallsPerTask: 8
        timeoutMs: 120000
